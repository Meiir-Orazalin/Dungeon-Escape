name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run final release quality gates
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: pnpm check:release

      - name: Install Chromium, Firefox, WebKit, and system dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
        run: pnpm test:e2e:install:all

      - name: Run deep Chromium tests
        run: pnpm test:e2e

      - name: Run core browser release matrix
        run: pnpm test:e2e:release

      - name: Run Canvas fallback tests
        run: pnpm test:e2e:canvas

      - name: Run lifecycle soak
        run: pnpm test:soak

      - name: Audit production artifact
        run: pnpm audit:production

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  live-smoke:
    name: Live production browser matrix
    if: ${{ vars.PRODUCTION_DOMAIN_READY == 'true' }}
    needs: deploy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium, Firefox, WebKit, and system dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
        run: pnpm test:e2e:install:all

      - name: Run live production browser matrix
        env:
          LIVE_BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: pnpm test:live:matrix
