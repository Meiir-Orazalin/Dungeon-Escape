<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Dungeon Escape — a dark fantasy movement prototype built with Phaser."
    />
    <meta name="theme-color" content="#080b0f" />
    <title>Dungeon Escape</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="site-header" aria-label="Dungeon Escape prototype">
        <div class="brand-mark" aria-hidden="true">DE</div>
        <div>
          <p class="eyebrow">Expedition 01 · Foundation</p>
          <h1>Dungeon Escape</h1>
        </div>
        <p class="phase-badge"><span></span> Prototype online</p>
      </header>

      <section class="game-frame" aria-label="Dungeon Escape game area">
        <span class="frame-corner frame-corner--top-left" aria-hidden="true"></span>
        <span class="frame-corner frame-corner--top-right" aria-hidden="true"></span>
        <span class="frame-corner frame-corner--bottom-left" aria-hidden="true"></span>
        <span class="frame-corner frame-corner--bottom-right" aria-hidden="true"></span>
        <div id="game-container"></div>
      </section>

      <footer class="control-strip" id="game-help">
        <p><kbd>WASD</kbd> <span>or</span> <kbd>Arrow Keys</kbd> to move</p>
        <span class="divider" aria-hidden="true"></span>
        <p><kbd>R</kbd> to restart</p>
        <p class="scene-status" id="game-state" aria-live="polite">Loading dungeon…</p>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
