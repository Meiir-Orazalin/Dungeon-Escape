<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="application-name" content="Dungeon Escape" />
    <meta name="author" content="Meiir Orazalin" />
    <meta
      name="description"
      content="Explore a shifting dungeon, fight deterministic enemies, recover the Runic Key, and escape through the Ancient Gate."
    />
    <meta name="theme-color" content="#080b0f" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://meiirorazalin.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:title" content="Dungeon Escape — Deterministic Dark-Fantasy Action Game" />
    <meta
      property="og:description"
      content="Explore a shifting dungeon, fight deterministic enemies, recover the Runic Key, and escape through the Ancient Gate."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://meiirorazalin.com/" />
    <meta property="og:image" content="https://meiirorazalin.com/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Dungeon Escape title framed by an amber runic gate in a dark stone dungeon."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dungeon Escape — Deterministic Dark-Fantasy Action Game" />
    <meta
      name="twitter:description"
      content="Explore a shifting dungeon, fight deterministic enemies, recover the Runic Key, and escape through the Ancient Gate."
    />
    <meta name="twitter:image" content="https://meiirorazalin.com/social-preview.png" />
    <meta
      name="twitter:image:alt"
      content="Dungeon Escape title framed by an amber runic gate in a dark stone dungeon."
    />
    <title>Dungeon Escape — Deterministic Dark-Fantasy Action Game</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="site-header" aria-label="Dungeon Escape">
        <div class="brand-mark" aria-hidden="true">DE</div>
        <div>
          <p class="eyebrow">Deterministic Dark-Fantasy Action Game</p>
          <h1>Dungeon Escape</h1>
        </div>
        <p class="phase-badge"><span></span> Playable online</p>
      </header>

      <section class="game-frame" aria-label="Dungeon Escape game area">
        <span class="frame-corner frame-corner--top-left" aria-hidden="true"></span>
        <span class="frame-corner frame-corner--top-right" aria-hidden="true"></span>
        <span class="frame-corner frame-corner--bottom-left" aria-hidden="true"></span>
        <span class="frame-corner frame-corner--bottom-right" aria-hidden="true"></span>
        <div id="game-container"></div>
      </section>

      <footer class="control-strip" id="game-help">
        <p><kbd>WASD</kbd> <span>or</span> <kbd>Arrow Keys</kbd> to move</p>
        <span class="divider" aria-hidden="true"></span>
        <p><kbd>Space / J / Click</kbd> attack</p>
        <span class="divider" aria-hidden="true"></span>
        <p><kbd>Shift</kbd> dash</p>
        <span class="divider" aria-hidden="true"></span>
        <p><kbd>E</kbd> interact</p>
        <span class="divider" aria-hidden="true"></span>
        <p><kbd>R</kbd> to restart</p>
        <span class="divider" aria-hidden="true"></span>
        <p><kbd>N</kbd> new dungeon</p>
        <p class="scene-status" id="game-state" aria-live="polite">Loading dungeon…</p>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
